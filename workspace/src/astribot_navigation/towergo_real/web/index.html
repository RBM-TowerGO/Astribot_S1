<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TowerGO · 实时建图</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#e8edf4;background:#10171f}*{box-sizing:border-box}body{margin:0;padding:28px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}h1{font-size:23px;margin:0 0 6px}p{color:#9cacbf;margin:0;font-size:14px}.badge{border:1px solid #344455;border-radius:20px;padding:8px 14px;color:#adc4d9;font-size:13px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px}.map{position:relative;background:#202a35;border:1px solid #344455;border-radius:14px;min-height:600px;overflow:hidden}canvas{width:100%;height:100%;position:absolute}.empty{position:absolute;top:45%;width:100%;text-align:center;color:#a9bacb;pointer-events:none}.legend{position:absolute;bottom:18px;left:18px;background:#10171fde;padding:10px 14px;border-radius:8px;font-size:12px;color:#bac9d8}.panel{background:#19232e;border:1px solid #344455;border-radius:14px;padding:20px;margin-bottom:16px}h2{font-size:14px;color:#9cacbf;font-weight:500;margin:0 0 12px}.value{font-size:20px;margin-bottom:8px;overflow-wrap:anywhere}.detail{color:#b8c7d6;font-size:13px;line-height:1.7;overflow-wrap:anywhere}.good{color:#7ee1b6}.warn{color:#ffce83}.bad{color:#ff9696}.diagnostic{margin:10px 0;padding-top:10px;border-top:1px solid #344455}footer{font-size:12px;color:#8193a7;margin-top:16px}@media(max-width:850px){body{padding:16px}.layout{grid-template-columns:1fr}.map{min-height:420px}header{gap:12px}.badge{white-space:nowrap}}
</style>
<header><div><h1>TowerGO <span style="font-weight:400;color:#9cacbf">/ 实时建图</span></h1><p>S1 · 前 MID360 + IMU · 二维 SLAM</p></div><span id="connection" class="badge">正在连接</span></header>
<div class="layout"><main class="map"><canvas id="map"></canvas><div id="empty" class="empty">等待地图数据<br><small>启动建图后，地图将在这里持续更新</small></div><div class="legend">黑：障碍物　白：已观测空闲　灰：未知　<span class="good">绿：轨迹</span></div></main>
<aside><section class="panel"><h2>建图状态</h2><div id="mapping" class="value">等待数据</div><div id="mapmeta" class="detail">—</div></section><section class="panel"><h2>底盘状态</h2><div id="control" class="value">未连接</div><div id="reason" class="detail">在独立 SSH 终端操作键盘</div></section><section class="panel"><h2>当前位置</h2><div id="position" class="detail">等待有效定位</div></section><section class="panel"><h2>诊断</h2><div id="diagnostics" class="detail">暂无数据</div></section></aside></div>
<footer>只读地图页面 · 1 秒刷新 · 轨迹为当前地图坐标下的里程计轨迹 · 键盘控制在独立终端运行</footer>
<script>
const $=id=>document.getElementById(id);const canvas=$('map');const ctx=canvas.getContext('2d');let latest=null;let img=new Image();let imageKey='';
function draw(){const box=canvas.parentElement.getBoundingClientRect();canvas.width=box.width*devicePixelRatio;canvas.height=box.height*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.clearRect(0,0,box.width,box.height);if(!latest?.map||!img.complete||!img.naturalWidth)return;let m=latest.map;let scale=Math.min((box.width-50)/m.width,(box.height-50)/m.height);let ox=(box.width-m.width*scale)/2,oy=(box.height-m.height*scale)/2;ctx.imageSmoothingEnabled=false;ctx.drawImage(img,ox,oy,m.width*scale,m.height*scale);const pixel=([x,y])=>{let dx=x-m.origin[0],dy=y-m.origin[1],c=Math.cos(m.origin[2]),s=Math.sin(m.origin[2]);return[ox+(c*dx+s*dy)/m.resolution*scale,oy+(m.height-(-s*dx+c*dy)/m.resolution)*scale]};ctx.strokeStyle='#1baf87';ctx.lineWidth=2;ctx.beginPath();(latest.trajectory||[]).forEach((p,i)=>{let q=pixel(p);i?ctx.lineTo(...q):ctx.moveTo(...q)});ctx.stroke();if(latest.pose){let p=pixel(latest.pose),a=-(latest.pose[2]-m.origin[2]);ctx.save();ctx.translate(...p);ctx.rotate(a);ctx.fillStyle='#ff834d';ctx.beginPath();ctx.moveTo(11,0);ctx.lineTo(-7,-6);ctx.lineTo(-4,0);ctx.lineTo(-7,6);ctx.closePath();ctx.fill();ctx.restore()}}
async function update(){try{const response=await fetch('/api/state',{cache:'no-store',signal:AbortSignal.timeout(3000)});if(!response.ok)throw Error('HTTP '+response.status);latest=await response.json();$('connection').textContent='已连接 · 只读';let m=latest.map,ages=latest.ages||{};let stale=(ages.map??Infinity)>5;$('empty').style.display=m?'none':'block';$('mapping').textContent=latest.mapping_fault?'会话已停止':m?(stale?'地图数据已过期':'地图更新中'):'等待地图';$('mapping').className='value '+(latest.mapping_fault?'bad':stale?'warn':'good');$('mapmeta').textContent=m?`${m.width} × ${m.height} 栅格 · ${(m.resolution*100).toFixed(1)} cm/格 · 更新于 ${ages.map.toFixed(1)} 秒前`:'启动建图后显示地图尺寸';let c=latest.control;let cs=(ages.control??Infinity)>1;$('control').textContent=cs?'状态已过期':({disabled:'未启用',ready:'已就绪',moving:'运动中',fault:'故障锁停'}[c?.state]||'未连接');$('control').className='value '+(cs?'warn':c?.state==='fault'?'bad':'good');$('reason').textContent=c?`${c.backend==='fake'?'软件测试后端 · ':''}${c.reason}`:'在独立 SSH 终端操作键盘';$('position').textContent=latest.pose?`X ${latest.pose[0].toFixed(2)} m · Y ${latest.pose[1].toFixed(2)} m · 朝向 ${(latest.pose[2]*180/Math.PI).toFixed(1)}°`:'等待有效定位';$('diagnostics').replaceChildren();for(const [name,row]of Object.entries(latest.diagnostics||{})){let el=document.createElement('div');el.className='diagnostic '+(row.level>=2?'bad':row.level?'warn':'good');el.textContent=name.replace('towergo/','')+' · '+row.message;$('diagnostics').append(el)}if(m&&m.png!==imageKey){imageKey=m.png;img.onload=draw;img.src='data:image/png;base64,'+m.png}else draw()}catch(e){$('connection').textContent='连接中断';$('mapping').textContent='显示数据已过期';$('mapping').className='value warn';$('control').textContent='状态未知';$('control').className='value warn'}finally{setTimeout(update,1000)}}
window.addEventListener('resize',draw);update();
</script></html>
