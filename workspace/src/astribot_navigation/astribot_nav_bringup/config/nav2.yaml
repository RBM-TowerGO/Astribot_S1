amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.05
    min_particles: 500
    max_particles: 2000
    max_beams: 120
    laser_model_type: likelihood_field
    laser_max_range: 12.0
    laser_min_range: 0.15
    laser_likelihood_max_dist: 2.0
    sigma_hit: 0.2
    z_hit: 0.95
    z_rand: 0.05
    update_min_d: 0.05
    update_min_a: 0.05
    resample_interval: 1
    transform_tolerance: 0.3
    tf_broadcast: true
    set_initial_pose: false
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ''
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.25
      use_astar: false
      allow_unknown: false
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      # At 0.1 rad/s, a half-turn takes over 31 s without XY progress.
      # Near-goal deceleration also needs smaller translation checkpoints.
      required_movement_radius: 0.05
      movement_time_allowance: 60.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.08
      stateful: true
    FollowPath:
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: dwb_core::DWBLocalPlanner
      angular_dist_threshold: 0.35
      angular_disengage_threshold: 0.1
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.1
      max_angular_accel: 0.1
      simulate_ahead_time: 2.0
      rotate_to_goal_heading: true
      closed_loop: true
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.1
      max_vel_y: 0.0
      max_vel_theta: 0.1
      min_speed_xy: 0.0
      max_speed_xy: 0.1
      min_speed_theta: 0.0
      acc_lim_x: 0.1
      acc_lim_y: 0.0
      acc_lim_theta: 0.1
      decel_lim_x: -0.1
      decel_lim_y: 0.0
      decel_lim_theta: -0.1
      vx_samples: 12
      vy_samples: 1
      vtheta_samples: 24
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.08
      trans_stopped_velocity: 0.01
      short_circuit_trajectory_evaluation: true
      debug_trajectory_details: true
      stateful: true
      critics: [RotateToGoal, Oscillation, ObstacleFootprint, GoalAlign, PathAlign, PathDist, GoalDist]
      ObstacleFootprint.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint_padding: 0.06
      footprint: '[[0.4,0.35],[0.4,-0.35],[-0.4,-0.35],[-0.4,0.35]]'
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: front back
        front:
          topic: /livox/lidar_front
          data_type: PointCloud2
          sensor_frame: lidar_front
          clearing: true
          marking: true
          obstacle_max_range: 10.0
          raytrace_max_range: 12.0
          min_obstacle_height: 0.15
          max_obstacle_height: 1.5
          observation_persistence: 0.0
        back:
          topic: /livox/lidar_back
          data_type: PointCloud2
          sensor_frame: lidar_back
          clearing: true
          marking: true
          obstacle_max_range: 10.0
          raytrace_max_range: 12.0
          min_obstacle_height: 0.15
          max_obstacle_height: 1.5
          observation_persistence: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.65
        cost_scaling_factor: 3.0
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      footprint_padding: 0.06
      footprint: '[[0.4,0.35],[0.4,-0.35],[-0.4,-0.35],[-0.4,0.35]]'
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.65
        cost_scaling_factor: 3.0
      always_send_full_costmap: true
behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, wait]
    spin:
      plugin: nav2_behaviors/Spin
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.1
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.1
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
