<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TowerGO · 实时建图</title>
<style>
:root{color-scheme:dark;font:15px system-ui,sans-serif;background:#101922;color:#e0edf3}*{box-sizing:border-box}body{margin:0}header{padding:22px 28px;border-bottom:1px solid #2c3c47;display:flex;align-items:center;gap:18px}h1{font-size:22px;margin:0}header span{color:#98acba}main{display:grid;grid-template-columns:1fr 290px;min-height:calc(100vh - 82px)}section{position:relative;min-width:0}canvas{width:100%;height:calc(100vh - 82px);display:block;touch-action:none}.tools{position:absolute;left:20px;top:18px;display:flex;gap:10px;align-items:center}button{border:1px solid #526a7b;border-radius:7px;background:#20313e;color:white;padding:9px 13px;cursor:pointer}label{background:#20313e;padding:8px;border-radius:7px}aside{padding:24px 20px;border-left:1px solid #2c3c47}h2{font-size:13px;color:#8fa7b8;font-weight:500;margin:0 0 8px}article{margin-bottom:25px}#status{font-size:20px;color:#6cd7c5}p{line-height:1.7;color:#a6bac8}pre{white-space:pre-wrap;word-break:break-all;font:12px monospace;color:#9eb7c9}#error{color:#ffb495}small{color:#91a8b9;line-height:1.7}#badge{padding:5px 10px;background:#243744;border-radius:20px;font-size:12px}footer{position:absolute;bottom:20px;left:22px;color:#90aabe;font-size:12px;background:#101922b0;padding:8px;border-radius:5px}@media(max-width:760px){main{grid-template-columns:1fr}aside{border-top:1px solid #2c3c47}canvas{height:65vh}header{padding:16px}header span{display:none}}
</style>
<header><h1>TowerGO</h1><span>双雷达二维切片 · 导航地图</span><b id="badge">连接中</b></header>
<main><section><canvas id="map" aria-label="二维占据地图与 IMU 轨迹"></canvas>
<div class="tools"><button id="fit">适应地图</button><label><input id="follow" type="checkbox"> 跟随当前位置</label></div>
<footer>黑：障碍 · 白：空闲 · 灰：未知 · 橙：IMU/LIO 轨迹 · 滚轮缩放 / 拖动平移</footer></section>
<aside><article><h2>会话状态</h2><div id="status">等待数据</div><p id="error"></p></article>
<article><h2>录制时长 / 剩余空间</h2><div id="time">—</div></article>
<article><h2>地图与轨迹</h2><div id="counts">—</div><p id="pose">尚无 LIO 位置</p></article>
<article><h2>双雷达融合统计</h2><pre id="fusion">等待两路雷达</pre><p id="validation"></p></article>
<article><h2>数据更新时间</h2><pre id="ages">—</pre></article>
<article><h2>会话</h2><pre id="run">—</pre><pre id="frame">—</pre></article>
<small>页面只读，不控制机器人。<br>驾驶请使用 SSH 终端：W/S 前后，Q/E 转向，空格保持，X 结束。<br><br>地图只表示选定水平薄层。其他高度障碍需由导航实时避障处理。位置为 IMU/LIO 位置，尚未接入自主导航。</small>
</aside></main>
<script>
'use strict';
const $=id=>document.getElementById(id), canvas=$('map'),ctx=canvas.getContext('2d');
let gridImage=null;
let state=null,scale=35,cx=0,cy=0,width=0,height=0,drag=null,first=true,lastGood=0;
const labels={initializing:'初始化中',mapping:'正在建图',sensor_tail:'保存停车尾段',closing:'关闭录包',finalizing:'生成地图文件',complete:'完成',incomplete:'未完成'};
function resize(){const r=canvas.getBoundingClientRect(),d=window.devicePixelRatio||1;width=r.width;height=r.height;canvas.width=width*d;canvas.height=height*d;ctx.setTransform(d,0,0,d,0,0);draw()}
function screen(p){return [(p[0]-cx)*scale+width/2,height/2-(p[1]-cy)*scale]}
function fit(){const g=state?.slice?.grid;if(!g)return;cx=g.origin[0]+g.width*g.resolution/2;cy=g.origin[1]+g.height*g.resolution/2;scale=Math.max(.2,Math.min((width-80)/(g.width*g.resolution),(height-120)/(g.height*g.resolution)));draw()}
function draw(){ctx.fillStyle='#101922';ctx.fillRect(0,0,width,height);ctx.strokeStyle='#20313c';ctx.lineWidth=1;const grid=Math.pow(10,Math.floor(Math.log10(80/scale)));for(let x=Math.floor((cx-width/2/scale)/grid)*grid;x<cx+width/2/scale;x+=grid){const sx=screen([x,0])[0];ctx.beginPath();ctx.moveTo(sx,0);ctx.lineTo(sx,height);ctx.stroke()}for(let y=Math.floor((cy-height/2/scale)/grid)*grid;y<cy+height/2/scale;y+=grid){const sy=screen([0,y])[1];ctx.beginPath();ctx.moveTo(0,sy);ctx.lineTo(width,sy);ctx.stroke()}if(!state)return;
const g=state.slice?.grid;if(g&&gridImage){const [x,y]=screen([g.origin[0],g.origin[1]+g.height*g.resolution]);ctx.imageSmoothingEnabled=false;ctx.drawImage(gridImage,x,y,g.width*g.resolution*scale,g.height*g.resolution*scale)}
ctx.strokeStyle='#ffac6b';ctx.lineWidth=2;ctx.beginPath();state.trajectory.forEach((p,i)=>{const [x,y]=screen(p);if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y)});ctx.stroke();if(state.pose){const [x,y]=screen(state.pose.xyz);ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fillStyle='#ffac6b';ctx.fill()}}
canvas.addEventListener('wheel',e=>{e.preventDefault();const r=canvas.getBoundingClientRect(),x=e.clientX-r.left-width/2,y=height/2-(e.clientY-r.top),wx=cx+x/scale,wy=cy+y/scale;scale=Math.max(.2,Math.min(1500,scale*Math.exp(-e.deltaY*.001)));cx=wx-x/scale;cy=wy-y/scale;draw()},{passive:false});
canvas.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY,cx,cy];canvas.setPointerCapture(e.pointerId);$('follow').checked=false});canvas.addEventListener('pointermove',e=>{if(drag){cx=drag[2]-(e.clientX-drag[0])/scale;cy=drag[3]+(e.clientY-drag[1])/scale;draw()}});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);$('fit').onclick=fit;
async function poll(){try{const response=await fetch('/api/state',{cache:'no-store',signal:AbortSignal.timeout(4000)});if(!response.ok)throw Error('HTTP '+response.status);state=await response.json();const sl=state.slice||{};state.trajectory=sl.trajectory||[];state.pose=sl.pose||null;if(sl.grid){const im=new Image();im.onload=()=>{gridImage=im;draw()};im.src='data:image/png;base64,'+sl.grid.png_base64}else gridImage=null;lastGood=Date.now();$('badge').textContent='已连接';$('status').textContent=labels[state.status]||state.status;$('error').textContent=state.error||'';$('validation').textContent=state.validation_warning||'';$('fusion').textContent=Object.entries(state.fusion||{}).map(([k,v])=>({front_input_points:'前雷达输入点',front_fused_points:'前雷达融合点',front_initial_discarded:'前雷达起始舍弃点',front_buffered_points:'前雷达缓冲点',back_input_points:'后雷达输入点',back_fused_points:'后雷达融合点',back_initial_discarded:'后雷达起始舍弃点',back_buffered_points:'后雷达缓冲点',front_gap_discarded:'前雷达缺帧窗口舍弃点',back_gap_discarded:'后雷达缺帧窗口舍弃点',front_expired_points:'前雷达过期缓存点',back_expired_points:'后雷达过期缓存点',skipped_windows:'跳过的不完整帧',windows:'融合帧数',max_callback_ms:'最大处理耗时(ms)'}[k]||k)+': '+v.toLocaleString()).join('\n')||'等待两路雷达';$('time').textContent=Math.floor(state.elapsed/60)+' 分 '+Math.floor(state.elapsed%60)+' 秒 / '+(state.free_gib??'—')+' GiB';$('counts').textContent=sl.grid?sl.grid.occupied.toLocaleString()+' 障碍格 · '+sl.grid.free.toLocaleString()+' 空闲格 · '+sl.grid.unknown.toLocaleString()+' 未知格':'等待切片数据';$('pose').textContent=state.pose?'LIO 位置：'+state.pose.xyz.map(x=>x.toFixed(2)).join(', ')+' m':'尚无 LIO 位置';$('ages').textContent=Object.entries(state.ages).map(([k,v])=>({front:'前雷达',back:'后雷达',imu:'前 IMU',adapted_cloud:'双雷达融合',adapted_imu:'适配 IMU',odom:'里程计',cloud:'地图点云'}[k]||k)+': '+v.toFixed(1)+' 秒前'+(v>2?' ⚠':'')).join('\n');$('run').textContent=state.run_id;$('frame').textContent='切片坐标系：'+(sl.frame||'等待')+'\n分辨率：'+(sl.grid?.resolution??.05)+' m\n相对前雷达初始高度：'+(sl.config?.offset??0)+' m\n薄层厚度：'+(sl.config?.thickness??.1)+' m';if(first&&sl.grid){fit();first=false}if($('follow').checked&&state.pose){[cx,cy]=state.pose.xyz}draw()}catch(e){$('badge').textContent='连接断开';$('error').textContent='网页未更新，请检查 SSH 隧道与建图终端。最后成功更新：'+(lastGood?Math.round((Date.now()-lastGood)/1000)+' 秒前':'暂无')}finally{setTimeout(poll,1000)}}
window.addEventListener('resize',resize);resize();poll();
</script></html>
